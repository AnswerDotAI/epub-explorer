[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-explorer"
dynamic = ["version"]
description = "Read, search, and export EPUBs into notebooks w/o extracting them."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Pol Alvarez", email = "pol.avms@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "html2text>=2025.4.15",
    "lxml>=6.0.4",
    "pillow>=12.2.0",
]

[project.urls]
Repository = "https://github.com/AnswerDotAI/epub-explorer"
Documentation = "https://AnswerDotAI.github.io/epub-explorer/"

[project.entry-points.nbdev]
epub_explorer = "epub_explorer._modidx:d"

[project.scripts]
epx = "epub_explorer.epx:epx"

[project.entry-points.fastaudit_import_allow]
epub_explorer = "epub_explorer"

[tool.setuptools.dynamic]
version = {attr = "epub_explorer.__version__"}

[tool.setuptools.packages.find]
include = ["epub_explorer"]

[tool.nbdev]

[project.entry-points.pyskills]
"epub_explorer.skill" = "epub_explorer.skill"
